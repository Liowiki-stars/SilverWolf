name: 银狼 iOS 云编译

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看 Xcode 版本
        run: xcodebuild -version

      - name: Archive 编译
        run: |
          xcodebuild \
            -project SilverWolf.xcodeproj \
            -scheme SilverWolf \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/SilverWolf.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: 检查 archive 内容
        run: |
          echo "=== archive 内容 ==="
          ls -la build/SilverWolf.xcarchive/Products/Applications/SilverWolf.app/
          echo ""
          echo "=== 可执行文件权限 ==="
          ls -l build/SilverWolf.xcarchive/Products/Applications/SilverWolf.app/SilverWolf

      - name: 打包 IPA
        run: |
          APP_PATH="build/SilverWolf.xcarchive/Products/Applications/SilverWolf.app"
          rm -rf Payload SilverWolf.ipa
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          chmod +x Payload/SilverWolf.app/SilverWolf
          # 列出 Payload 内容用于调试
          echo "=== Payload 内容 ==="
          find Payload -type f
          zip -r SilverWolf.ipa Payload
          ls -lh SilverWolf.ipa

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: SilverWolf-iOS-IPA
          path: SilverWolf.ipa
          retention-days: 30

      - name: 编译完成
        run: |
          echo "✅ 编译完成！"
          echo "📦 IPA 文件已生成，在 Artifacts 中下载"
