name: 银狼 iOS 云编译

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 切换到 Xcode 15
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Archive 编译
        run: |
          xcodebuild \
            -project SilverWolf.xcodeproj \
            -scheme SilverWolf \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/SilverWolf.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: 检查 archive 内容
        run: |
          echo "=== .app 内容 ==="
          ls -la build/SilverWolf.xcarchive/Products/Applications/SilverWolf.app/
          echo ""
          echo "=== Info.plist 关键信息 ==="
          plutil -p build/SilverWolf.xcarchive/Products/Applications/SilverWolf.app/Info.plist | head -20

      - name: 打包 IPA
        run: |
          APP_PATH="build/SilverWolf.xcarchive/Products/Applications/SilverWolf.app"
          rm -rf Payload SilverWolf.ipa
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          chmod +x Payload/SilverWolf.app/SilverWolf
          # 用 ditto 打包（macOS 标准方式，保留权限和属性）
          ditto -c -k --sequesterRsrc --keepParent Payload SilverWolf.ipa
          ls -lh SilverWolf.ipa
          echo ""
          echo "=== IPA 内容验证 ==="
          unzip -l SilverWolf.ipa

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: SilverWolf-iOS-IPA
          path: SilverWolf.ipa
          retention-days: 30
