name: 银狼 iOS 云编译

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看 Xcode 版本
        run: xcodebuild -version

      - name: 编译项目
        run: |
          xcodebuild \
            -project SilverWolf.xcodeproj \
            -scheme SilverWolf \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 查找编译产物
        run: |
          echo "查找 .app 文件..."
          find build -name "SilverWolf.app" -type d
          APP_PATH=$(find build -name "SilverWolf.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: 打包 IPA
        run: |
          rm -rf Payload SilverWolf.ipa
          mkdir Payload
          cp -r "${{ env.APP_PATH }}" Payload/
          zip -r SilverWolf.ipa Payload
          ls -lh SilverWolf.ipa

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: SilverWolf-iOS-IPA
          path: SilverWolf.ipa
          retention-days: 30

      - name: 编译完成
        run: |
          echo "✅ 编译完成！"
          echo "📦 IPA 文件已生成，在 Artifacts 中下载"
          echo "📱 用 Sideloadly 或 TrollStore 安装到手机"
